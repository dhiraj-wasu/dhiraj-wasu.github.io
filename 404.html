<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dhiraj Wasu - Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, then redirects the browser
      // to the new url with only a query string and hash fragment.
      var pathSegmentsToKeep = 0; // 0 for root user pages (https://<username>.github.io/)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?redirect=" +
          encodeURIComponent(
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/") +
              (l.search ? "&" + l.search.slice(1) : "") +
              l.hash
          )
      );
    </script>
  </head>
  <body>
  </body>
</html>
